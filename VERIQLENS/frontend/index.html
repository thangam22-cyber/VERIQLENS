<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERIQLENS - Verify what's real</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>VERIQLENS</h1>
  <p class="tag">An intelligent lens that verifies truth.</p>
  <label class="drop" for="file">Choose an image (JPG / PNG / WEBP, max 16 MB)</label>
  <input id="file" type="file" accept=".jpg,.jpeg,.png,.webp" hidden>
  <p id="status" role="status"></p>
  <section id="report" hidden></section>
  <p class="promise">We never store, share, or sell your images. Your image lives for analysis only, then it's gone.</p>
</main>
<script src="/app.js"></script>
</body>
</html>
